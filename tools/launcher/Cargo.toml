[package]
name = "showcase-launcher"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = "=0.2.2"
material-color-utils = "=0.1.3"
material3-gpui = { path = "../.." }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
